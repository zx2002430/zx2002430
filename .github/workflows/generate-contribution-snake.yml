name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake assets
        uses: Platane/snk@v3
        with:
          github_user_name: zx2002430
          outputs: |
            assets/contribution-snake.svg?palette=github-light&color_snake=%2358a6ff
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=%238ee7ff

      - name: Commit updated snake assets
        run: |
          if git diff --quiet -- assets/contribution-snake.svg assets/contribution-snake-dark.svg; then
            echo "Contribution snake is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          git commit -m "chore: refresh contribution snake [skip ci]"
          git push
